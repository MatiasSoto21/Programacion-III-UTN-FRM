<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="titulo">Trabajo Práctico JavaScript</h1>

    <h2>Lista de tareas</h2>
    <ul id="lista">
        <li>Estudiar JavaScript</li>
        <li>Practicar DOM</li>
        <li>Aprender Eventos</li>
    </ul>

    <hr>

    <h2>Agregar tarea (Click e Input)</h2>
    <input type="text" id="inputTarea" placeholder="Nueva tarea">
    <button id="btnAgregar">Agregar</button>

    <hr>

    <h2>Formulario (Submit)</h2>
    <form id="formulario">
        <input type="text" id="nombreFormulario" placeholder="Escribe tu nombre">
        <button type="submit">Enviar</button>
    </form>

    <p id="mensajeFormulario"></p>

    <hr>

    <h2>Seleccionar lenguaje favorito</h2>
    <select id="lenguajes">
        <option value="JavaScript">JavaScript</option>
        <option value="Java">Java</option>
        <option value="Python">Python</option>
        <option value="C#">C#</option>
    </select>

    <p id="resultadoSelect"></p>
    <script src="script.js"></script>
</body>
</html>
