<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>

<body>

    <header>
        <h1>Formulario de Registro</h1>
        <p>Completá tus datos para registrarte.</p>
    </header>

    <main>
        <form action="#" method="post">

            <fieldset>
                <legend>Datos personales</legend>

                <!-- Nombre completo -->
                <label for="nombre">Nombre completo:</label><br>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ej: Juan Pérez"
                    required
                    tabindex="1"
                >
                <br><br>

                <!-- Correo -->
                <label for="email">Correo electrónico:</label><br>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Ej: correo@ejemplo.com"
                    required
                    tabindex="2"
                >
                <br><br>

                <!-- Contraseña -->
                <label for="password">Contraseña:</label><br>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Mínimo 8 caracteres"
                    minlength="8"
                    required
                    tabindex="3"
                >
                <br><br>

            </fieldset>

            <fieldset>
                <legend>Información adicional</legend>

                <!-- Género -->
                <p>Género:</p>

                <input
                    type="radio"
                    id="masculino"
                    name="genero"
                    value="masculino"
                    required
                    tabindex="4"
                >
                <label for="masculino">Masculino</label>
                <br>

                <input
                    type="radio"
                    id="femenino"
                    name="genero"
                    value="femenino"
                    tabindex="5"
                >
                <label for="femenino">Femenino</label>
                <br>

                <input
                    type="radio"
                    id="otro"
                    name="genero"
                    value="otro"
                    tabindex="6"
                >
                <label for="otro">Otro</label>
                <br><br>

                <!-- Intereses -->
                <p>Intereses:</p>

                <input
                    type="checkbox"
                    id="musica"
                    name="intereses"
                    value="musica"
                    tabindex="7"
                >
                <label for="musica">Música</label>
                <br>

                <input
                    type="checkbox"
                    id="deporte"
                    name="intereses"
                    value="deporte"
                    tabindex="8"
                >
                <label for="deporte">Deporte</label>
                <br>

                <input
                    type="checkbox"
                    id="lectura"
                    name="intereses"
                    value="lectura"
                    tabindex="9"
                >
                <label for="lectura">Lectura</label>
                <br><br>

                <!-- País -->
                <label for="pais">País:</label><br>
                <select id="pais" name="pais" required tabindex="10">
                    <option value="">Seleccioná un país</option>
                    <option value="argentina">Argentina</option>
                    <option value="brasil">Brasil</option>
                    <option value="chile">Chile</option>
                </select>
                <br><br>

                <!-- Comentarios -->
                <label for="comentarios">Comentarios adicionales:</label><br>
                <textarea
                    id="comentarios"
                    name="comentarios"
                    rows="5"
                    cols="40"
                    placeholder="Escribí tus comentarios aquí..."
                    tabindex="11"
                ></textarea>
                <br><br>

            </fieldset>

            <!-- Botón de envío -->
            <button type="submit" tabindex="12">
                Registrarse
            </button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Formulario de Registro</p>
    </footer>

</body>
</html>
